kind = "web"
previewPath = "/"
title = "Jigjiga City Portal"
version = "1.0.0"
id = "artifacts/jigjiga-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18480

[services.development]
run = "pnpm --filter @workspace/jigjiga-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jigjiga-portal", "run", "build" ]
publicDir = "artifacts/jigjiga-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18480"
BASE_PATH = "/"
